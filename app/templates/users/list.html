{% extends 'base.html' %}
{% block content %}
  <div class="row">
    <h1>Пользователи</h1>
    <a class="btn" href="{{ url_for('users.create_user') }}">Добавить</a>
  </div>

  <div class="card">
    <table class="table">
      <thead>
        <tr><th>Логин</th><th>Роль</th><th>Создан</th><th></th></tr>
      </thead>
      <tbody>
        {% for u in users %}
          <tr>
            <td>{{ u.username }}</td>
            <td>{{ u.role }}</td>
            <td>{{ u.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
            <td class="actions">
              <form method="post" action="{{ url_for('users.reset_password', user_id=u.id) }}">
                <input name="new_password" placeholder="новый пароль" style="max-width: 160px;">
                <button class="link" type="submit">Сбросить</button>
              </form>
              <form method="post" action="{{ url_for('users.delete_user', user_id=u.id) }}" onsubmit="return confirm('Удалить пользователя?')">
                <button class="link danger" type="submit">Удалить</button>
              </form>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
