{% extends 'base.html' %}
{% block content %}
  <div class="min-h-[calc(100vh-32px)] flex items-center justify-center">
    <div class="w-full max-w-md">
      <div class="card" style="padding: 18px;">
        <div class="flex items-center gap-3" style="margin-bottom: 14px;">
          <div class="h-11 w-11 rounded-xl flex items-center justify-center" style="background: color-mix(in oklab,var(--primary) 14%, transparent); border: 1px solid color-mix(in oklab,var(--primary) 35%, var(--border));">
            <i class="ph ph-buildings text-2xl" style="color: var(--primary);"></i>
          </div>
          <div>
            <div class="text-xl font-extrabold leading-tight">Вход</div>
            <div class="muted" style="font-size: 13px; margin-top: 2px;">Войдите, чтобы продолжить работу</div>
          </div>
        </div>

        <form method="post" class="space-y-3">
          <label class="field" style="margin: 0;">
            <span>Логин</span>
            <input name="username" autocomplete="username" required>
          </label>
          <label class="field" style="margin: 0;">
            <span>Пароль</span>
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="btn" type="submit" style="width: 100%; padding: 12px 14px;">Войти</button>
        </form>

        <div class="muted" style="margin-top: 12px; font-size: 13px; line-height: 1.35;">
          После инициализации БД: логин <b>admin</b>, пароль <b>admin</b>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
