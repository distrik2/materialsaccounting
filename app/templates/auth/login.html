{% extends 'base.html' %}
{% block content %}
  <div class="card" style="max-width: 420px; margin: 40px auto;">
    <h1>Вход</h1>
    <form method="post">
      <label class="field">
        <span>Логин</span>
        <input name="username" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Пароль</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn" type="submit">Войти</button>
    </form>
    <p class="muted" style="margin-top: 12px;">После инициализации БД: логин <b>admin</b>, пароль <b>admin</b></p>
  </div>
{% endblock %}
